name: Publish to NPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Build & Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        # OIDC trusted publishing needs npm >= 11.5.1; Node 22.x ships npm 10.x,
        # so without this the publish silently falls back to token auth (and
        # fails once NPM_TOKEN is gone).
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Test Suite
        run: bun run test

      - name: Build Production Bundle
        run: bun run build

      - name: Publish to NPM
        # Authenticated by OIDC trusted publishing (npm -> Settings -> Trusted
        # Publisher, bound to listen-hai/ziwei-mcp + this filename). No
        # long-lived token: `id-token: write` above is the entire credential,
        # and provenance is attached automatically.
        run: npm publish --access public
